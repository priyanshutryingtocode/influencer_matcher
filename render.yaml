services:
  - type: web
    name: influencer-matcher-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: APP_ENV
        value: demo
      - key: AUTH_REQUIRED
        value: "true"
      - key: RUN_SCHEMA_ON_STARTUP
        value: "true"
      - key: MAX_MEMORY_JOBS
        value: "2"
      - key: MAX_MATCH_JOBS_PER_IP_PER_HOUR
        value: "12"
      - key: EMBED_MODEL
        value: gemini-embedding-001
      - key: EMBED_DIMENSIONS
        value: "768"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
